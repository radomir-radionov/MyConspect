name: Check conspect sources

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      track:
        description: "Limit to one track, or all"
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - backend
          - other

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RESOURCES_GIT_URL: ${{ secrets.RESOURCES_GIT_URL }}
      RESOURCES_GIT_TOKEN: ${{ secrets.RESOURCES_GIT_TOKEN }}
      RESOURCES_GIT_REF: ${{ secrets.RESOURCES_GIT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fetch study notes
        run: npx tsx scripts/ensure-resources.ts
      - name: Audit source URLs
        run: |
          mkdir -p reports
          TRACK_ARGS=()
          if [ "${TRACK}" != "all" ]; then
            TRACK_ARGS=(--track "${TRACK}")
          fi
          npx tsx scripts/audit.ts "${TRACK_ARGS[@]}" \
            --json --out reports/conspect-audit.json \
            | tee reports/conspect-audit.md
        env:
          TRACK: ${{ github.event.inputs.track || 'all' }}
      - name: Job summary
        if: always() && hashFiles('reports/conspect-audit.md') != ''
        run: cat reports/conspect-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('reports/conspect-audit.md') != ''
        with:
          name: conspect-audit
          path: reports/conspect-audit.*
          retention-days: 30
